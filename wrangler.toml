
name = "my-little-journey-admin-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-31"

# Database D1 untuk akun admin, OTP, dan session
[[d1_databases]]
binding = "DB"
database_name = "my-little-journey-admin"
database_id = "4665c38f-d154-424a-be93-c2fa4f1d941f"
migrations_dir = "worker/migrations"

# Cloudflare R2 untuk penyimpanan gambar
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "my-little-journey-media"

# Konfigurasi publik (bukan tempat menyimpan API key)
[vars]
SITE_ORIGINS = "https://vinkasar.my.id,https://www.vinkasar.my.id"
ADMIN_USERNAME = "vinkasar263121"
ADMIN_EMAIL = "vinkasriauliarinata@gmail.com"

# GitHub repository
GITHUB_OWNER = "aghiwidi"
GITHUB_REPO = "my-little-journey"
GITHUB_BRANCH = "main"

# Alamat publik gambar dari R2
R2_PUBLIC_BASE_URL = "https://media.vinkasar.my.id"
